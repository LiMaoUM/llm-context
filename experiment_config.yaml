# Experiment Configuration for LLM Context & Confidence Analysis

# ==============================================================================
# 1. MODELS TO EVALUATE
# ==============================================================================
models:
  # Large Models - Use GPU 1 and GPU 2 with tensor parallelism
  - name: "qwen3-80b-a3b"
    provider: "huggingface"
    config:
      model_id: "Qwen/Qwen3-Next-80B-A3B-Instruct-FP8"
      gpu_device: 1
      tensor_parallel_size: 2 # Use GPU 1 and GPU 2
      temperature: 0.7
      max_tokens: 1024

  - name: "llama-3.3-70b"
    provider: "huggingface"
    config:
      model_id: "meta-llama/Llama-3.3-70B-Instruct"
      gpu_device: 1
      tensor_parallel_size: 2  # Use GPU 1 and GPU 2
      temperature: 0.7
      max_tokens: 1024

  - name: "gpt-oss-120b"
    provider: "huggingface"
    config:
      model_id: "openai/gpt-oss-120b"
      gpu_device: 1
      tensor_parallel_size: 2  # Use GPU 1 and GPU 2
      temperature: 0.7
      max_tokens: 1024

  # Medium Models - Use GPU 1 only
  - name: "qwen3-30b-a3b"
    provider: "huggingface"
    config:
      model_id: "Qwen/Qwen3-30B-A3B-Instruct-2507-FP8"
      gpu_device: 1
      tensor_parallel_size: 1
      temperature: 0.7
      max_tokens: 1024

  - name: "gemma-3-27b-it"
    provider: "huggingface"
    config:
      model_id: "google/gemma-3-27b-it"
      gpu_device: 1
      tensor_parallel_size: 1
      temperature: 0.7
      max_tokens: 1024

  # Medium Models - Use GPU 2 only
  - name: "ministral-3-14b"
    provider: "huggingface"
    config:
      model_id: "mistralai/Ministral-3-14B-Instruct-2512"
      gpu_device: 2
      tensor_parallel_size: 1
      temperature: 0.7
      max_tokens: 1024

  # Small Models - Use GPU 1 only
  - name: "qwen3-4b"
    provider: "huggingface"
    config:
      model_id: "Qwen/Qwen3-4B-Instruct-2507"
      gpu_device: 1
      tensor_parallel_size: 1
      temperature: 0.7
      max_tokens: 1024

  - name: "llama-3.1-8b"
    provider: "huggingface"
    config:
      model_id: "meta-llama/Llama-3.1-8B-Instruct"
      gpu_device: 1
      tensor_parallel_size: 1
      temperature: 0.7
      max_tokens: 1024

  # Small Models - Use GPU 2 only
  - name: "ministral-3-8b"
    provider: "huggingface"
    config:
      model_id: "mistralai/Ministral-3-8B-Instruct-2512"
      gpu_device: 2
      tensor_parallel_size: 1
      temperature: 0.7
      max_tokens: 1024

# ==============================================================================
# 2. CONTEXT ABLATION SCHEME
# ==============================================================================
context_variants:
  - variant_name: "T"
    description: "Text only - focal post alone"
    include:
      - post_text: true
      - conversation: false
      - background: false
      - metadata: false
  
  - variant_name: "T+B"
    description: "Text + Background - add event summaries or entity descriptions"
    include:
      - post_text: true
      - conversation: false
      - background: true
      - metadata: false
  
  
  - variant_name: "T+B+C"
    description: "Text + Conversation + Background"
    include:
      - post_text: true
      - conversation: true
      - background: true
      - metadata: false
  
  - variant_name: "T+B+C+M"
    description: "Text + Background + Conversation + Metadata"
    include:
      - post_text: true
      - conversation: true
      - background: true
      - metadata: true
  

# ==============================================================================
# 3. PROMPT CONFIGURATION
# ==============================================================================
prompt_template: |
  You are a political discourse analyst specializing in social media content.
  
  TASK:
  Analyze the provided context and determine:
  1. The author's political ideology (Left, Center, or Right)
  2. The author's stance toward Donald Trump (if mentioned or implied)
  3. The robustness of these judgments, expressed as confidence scores (0-100)
  
  CONTEXT BLOCKS AVAILABLE:
  
  [Background Event Information]
  {background_section}
  
  [Conversation History]
  {conversation_section}
  
  [User Metadata]
  {metadata_section}
  
  [Target Post]
  {focal_post_text}
  
  ANALYSIS INSTRUCTIONS:
  - Use ONLY information from the non-empty context blocks above
  - Do NOT rely on external knowledge, world facts, or personal assumptions
  - If a context field is empty, treat it as unavailable information
  - Prefer explicit textual evidence; use inference only when necessary
  - If inference is used, it must be grounded in the provided text
  
  IMPORTANT: CONFIDENCE DEFINITION (CRITICAL)
  
  Confidence is NOT a measure of how strongly the author feels.
  Confidence IS a measure of how sufficient and stable the available context is for making the classification.
  
  Interpret confidence as follows:
  
  - 90–100: The conclusion is contextually decisive.
    The stance or ideology is explicit or logically fixed.
    Additional reasonable context would NOT change the result.
    (e.g., "I am a MAGA and will vote for Trump.")
  
  - 60–80: The conclusion is supported by evidence but not fully locked in.
    Additional context could plausibly refine or reverse the judgment.
    (e.g., repeated partisan cues without explicit self-identification)
  
  - 30–50: The conclusion is weakly supported and highly context-sensitive.
    Platform norms, tone, or missing background could easily change the interpretation.
    (e.g., "Trump is going to win" without affective or evaluative language)
  
  - 0–20: The available context is insufficient or contradictory.
    The classification is largely speculative.
    (e.g., vague mentions, irony, or unclear references)
  
  DO NOT inflate confidence.
  If the interpretation depends heavily on missing context, platform norms, or assumed intent, confidence MUST be low.
  
  QUESTIONS TO ANSWER:
  
  1. POLITICAL IDEOLOGY
     Based on the context, what is the author's political ideology?
     - Left: Progressive / liberal / socialist values
     - Center: Moderate / centrist values
     - Right: Conservative
  
  2. STANCE TOWARD POLITICAL FIGURES
     What is the author's stance toward Donald Trump?
     Classify as:
     - favor: Supports or approves
     - against: Opposes or disapproves
     - neutral: Mentions without evaluative direction
  
  RESPONSE CONSTRAINTS:
  - You MUST respond with ONLY valid JSON
  - Do NOT include explanations, notes, or reasoning outside the JSON
  - Confidence values must reflect the definition above, not subjective certainty
  
  RESPONSE FORMAT (VALID JSON ONLY):
  
  {{
    "ideology": "Left" | "Center" | "Right",
    "ideology_confidence": <integer 0–100>,
    "stance": "favor" | "against" | "neutral",
    "stance_confidence": <integer 0–100>
  }}
  
  Respond with ONLY the JSON object. Do not include any additional text.

prompt_sections:
  background: |
    [BACKGROUND CONTEXT]
    Event: {event_name}
    Date: {event_date}
    Key Information: {event_summary}
    
  conversation: |
    [CONVERSATION HISTORY]
    {parent_posts_formatted}
    {child_posts_formatted}
    
  metadata: |
    [USER METADATA]
    Author: {user_name}
    Bio: {user_bio}
    Followers: {follower_count}
    Verified: {verified_status}
    
    [POST METADATA]
    Posted: {post_timestamp}
    
    [RECENT USER POSTS]
    Recent posts by this user (last 5, excluding current post):
    {recent_user_posts_formatted}

# ==============================================================================
# 4. TASKS & TARGETS
# ==============================================================================
tasks:
  - task_id: "political_ideology_stance"
    task_name: "Political Ideology and Stance Detection"
    description: "Infer political ideology and stance toward Biden and Trump"
    
    ideology_options:
      - "Left"
      - "Center"
      - "Right"
    
    stance_options:
      - "favor"
      - "against"
      - "neutral"
      - "undecided"
    
    figures:
      - "Trump"
      - "Biden"
    
    instructions: |
      You are a political discourse analyst.
      Your task is to infer a social media user's political ideology and their stance toward specific political figures using ONLY the information provided.
      
      Some contextual fields may be empty.
      If a field is empty, treat it as unavailable and do not speculate beyond the provided information.
      
      Context Provided:
      - [Background]: Event context and timeline
      - [Conversation History]: Parent/child posts
      - [User Metadata]: Author information
      - [Target Post]: The focal post to analyze
      
      Use information from all non-empty fields, but do not rely on any external knowledge beyond this context.
    
    output_format: |
      {
        "ideology": "Left|Center|Right",
        "ideology_confidence": 0-100,
        "stance": "favor|against|neutral",
        "stance_confidence": 0-100
      }

# ==============================================================================
# 5. EVALUATION METRICS
# ==============================================================================
evaluation_metrics:
  accuracy:
    type: "classification"
    description: "Fraction of correct stance predictions"
  
  f1_score:
    type: "classification"
    description: "F1 score weighted across stance categories"
  
  ece:  # Expected Calibration Error
    type: "calibration"
    description: "Average difference between confidence and accuracy"
    bins: 10
  
  brier_score:
    type: "calibration"
    description: "Mean squared error between predicted confidence and correctness"
  
  overconfidence_rate:
    type: "confidence"
    description: "Fraction of incorrect predictions with >70% confidence"
    threshold: 70
  
  context_sensitivity:
    type: "ablation"
    description: "Performance delta when adding/removing a context type"
    baseline: "T"
  
  marginal_improvement:
    type: "ablation"
    description: "Improvement from adding each context dimension"

# ==============================================================================
# 6. ANALYSIS PLAN
# ==============================================================================
analysis:
  sections:
    - name: "accuracy_by_context"
      description: "Plot accuracy gains for each context addition"
      visualizations:
        - type: "bar_plot"
          x: "context_variant"
          y: "accuracy"
          group_by: "model"
        - type: "heatmap"
          x: "context_variant"
          y: "model"
          value: "accuracy"
    
    - name: "calibration_analysis"
      description: "Calibration curves showing confidence vs actual accuracy"
      visualizations:
        - type: "calibration_curve"
          x: "predicted_confidence"
          y: "actual_accuracy"
          group_by: "model"
        - type: "line_plot"
          x: "context_variant"
          y: ["ece", "brier_score"]
          group_by: "model"
    
    - name: "overconfidence_analysis"
      description: "Cases where models are confidently wrong"
      visualizations:
        - type: "bar_plot"
          x: "context_variant"
          y: "overconfidence_rate"
          group_by: "model"
    
    - name: "context_interaction_effects"
      description: "Synergistic gains and diminishing returns"
      visualizations:
        - type: "bar_plot"
          x: "context_combination"
          y: "marginal_improvement"
        - type: "line_plot"
          title: "Diminishing Returns by Context Depth"
          x: "context_depth"
          y: "accuracy"
    
    - name: "error_analysis"
      description: "Qualitative case studies of model failures"
      analysis_type: "manual_review"
      sample_size: 20

# ==============================================================================
# 7. EXPERIMENT EXECUTION
# ==============================================================================
execution:
  batch_size: 32
  max_retries: 3
  retry_delay: 2
  cache_responses: true
  save_interval: 100  # Save results every N samples
  output_dir: "./results"
  
  sampling:
    strategy: "stratified"  # balanced across stance categories
    test_size: 0.2
    seed: 42

# ==============================================================================
# 8. METADATA FOR REPRODUCIBILITY
# ==============================================================================
reproducibility:
  version: "2.0"
  created_date: "2026-01-15"
  author: "Mao Li"
  notes: "Updated experiment with improved prompt (contextual confidence), Trump-only stance detection, and 1024 max_tokens to prevent truncation"
  changes: |
    - Replaced multi-figure stance detection with single Trump-only stance
    - Added explicit confidence definition focusing on contextual sufficiency
    - Increased max_tokens from 512 to 1024 for all models
    - Simplified JSON output format
    - Removed reasoning field to enforce JSON-only output
